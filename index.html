<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICoffee</title>
    <!-- CSS Link -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Boxicons Link -->
    <!-- Basic Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <!-- Filled Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
    <!-- Brand Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">

    <!-- Google Fonts Link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">


</head>

<body>

    <!-- Navbar -->
    <nav class="navbar-container">
        <div class="logo-link">
            <a href="index.html" class="logo-link">
                <i class="bx bx-cup-hot"></i> ICoffe
            </a>
        </div>

        <div class="navigation">
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>
                <li>
                    <a href="cart.html"><i class="bx bx-cart-alt"></i> Cart</a>
                </li>
            </ul>

            <button id="dark-mode-toggle" type="button" class="dark-mode-button">
                <i class="bx bx-moon"></i>
            </button>
        </div>

        <button id="hamburger-toggle" type="button" class="hamburger-button">
            <i class="bx bx-menu" id="hamburger-icon"></i>
        </button>
    </nav>

    <!-- Header -->
    <header class="header-container">
        <h1>Welcome Guest To Our Coffee Ordering App</h1>
        <p>Please enter your name :</p>
        <input type="text">
    </header>

    <!-- Main Content -->
    <main class="main-container">
        <h2>Our Coffee Products</h2>

        <div class="products-container">
            <div class="coffee-product">
                <div class="image">
                    <img src="assets/img/ice-espresso.png" alt="ice-espresso">
                </div>
                <div class="details">
                    <h3>Ice Espresso</h3>
                    <p>Rp. 12.0000</p>
                    <div class="add">
                        <button>-</button>
                        <p>1</p>
                        <button>+</button>
                    </div>
                </div>
            </div>

            <div class="coffee-product">
                <div class="image">
                    <img src="assets/img/ice-latte.png" alt="ice-latte">
                </div>
                <div class="details">
                    <h3>Ice Latte</h3>
                    <p>Rp. 10.0000</p>
                    <div class="add">
                        <button>-</button>
                        <p>1</p>
                        <button>+</button>
                    </div>
                </div>
            </div>

            <div class="coffee-product">
                <div class="image">
                    <img src="assets/img/ice-cappuccino.png" alt="ice-cappuccino">
                </div>
                <div class="details">
                    <h3>Ice Cappuccino</h3>
                    <p>Rp. 11.0000</p>
                    <div class="add">
                        <button>-</button>
                        <p>1</p>
                        <button>+</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer-container">
        ICoffee Copyright &copy; 2026
    </footer>

</body>

</html>
